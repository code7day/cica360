name: Build y deploy (CICA360 front)

# Ver docs/context/ARCHITECTURE.md §6. El build corre acá (Node disponible
# en el runner) — el shared hosting de destino nunca ejecuta Node, solo
# recibe el `dist/` resultante por FTP/SFTP.
#
# 2026-09-17 (Fase 6 post-MVP adelantada, ver ADR-006/PROGRESS.md): el
# trigger `repository_dispatch` permite que Genesis (el backend headless)
# dispare este mismo workflow cuando se guarda contenido en Studio —
# `FrontendDeployService`/`TriggerFrontendDeploy` (genesis) hacen el POST a
# `repos/{owner}/{repo}/dispatches` con `event_type: content-updated`. El
# `types:` de abajo tiene que coincidir EXACTO con esa constante
# (`FrontendDeployService::EVENT_TYPE`).

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  repository_dispatch:
    types: [content-updated]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build (astro check + astro build)
        run: npm run build
        env:
          STAMLESS_API_URL: ${{ secrets.STAMLESS_API_URL }}
          STAMLESS_TENANT_SLUG: cica360
          STAMLESS_API_TOKEN: ${{ secrets.STAMLESS_API_TOKEN }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_CONTACT_FORM_ENDPOINT: /contacto.php

      # Artifact de respaldo (2026-09-13, ver ARCHITECTURE.md §6): sigue
      # subiéndose SIEMPRE, aunque el deploy de abajo ya sea automático —
      # sirve como rollback manual rápido (bajar el zip de un run anterior y
      # subirlo a mano si el FTP automático fallara o hiciera falta revertir
      # sin esperar un nuevo build). `dist/` sin la carpeta en sí, los
      # archivos quedan en la RAÍZ del zip al descargarlo — se sube/extrae
      # tal cual en el File Manager de cPanel, en el document root del
      # dominio. `.env` (credenciales reales de `contacto.php`/`ipinfo.php`,
      # ver `public/_env.php`) vive un nivel POR ENCIMA del document root a
      # propósito — ni el zip ni el FTP de abajo lo tocan/pisan nunca, se
      # configura una sola vez en el servidor y sobrevive a cada redeploy.
      - uses: actions/upload-artifact@v4
        with:
          name: cica360-dist
          path: dist/
          retention-days: 7

      # --- Deploy automático (FTP) ---
      # 2026-09-17 (Fase 6 post-MVP adelantada, ver ADR-006/PROGRESS.md):
      # reemplaza la decisión de 2026-09-13 de mantener el paso a producción
      # manual — un cambio de contenido en Studio ya no se reflejaba en la
      # website sin que alguien bajara y subiera el zip a mano, lo cual va
      # contra la premisa de un CMS headless ("editar y ver el cambio").
      # Requiere los secrets `FTP_SERVER`/`FTP_USERNAME`/`FTP_PASSWORD`
      # configurados en Settings → Secrets and variables → Actions de este
      # repo — sin ellos, este paso falla (el resto del workflow ya corrió
      # bien igual, el artifact de arriba sigue disponible como fallback).
      - name: Deploy a shared hosting (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # 2026-09-18: la cuenta FTP no aterriza en public_html/ por
          # default -- aterriza en la raíz de la cuenta. `server-dir: ./`
          # (el default anterior) terminó creando una copia duplicada de
          # todo el sitio en la raíz del hosting, fuera de public_html/.
          # Hay que apuntar explícito al document root real.
          server-dir: ./public_html/
          # 2026-09-18: el hosting (Ferozo/DonWeb) devuelve "550 .htaccess:
          # Permission denied" al intentar escribirlo por FTP, aunque el
          # resto de los 118 archivos suba sin problema — es una protección
          # típica de hosting compartido sobre este archivo puntual. El
          # `.htaccess` acá es estático (reglas de rewrite/HTTPS, no cambia
          # con cada edición de contenido en Studio), así que se excluye del
          # deploy automático y se sube UNA vez a mano por el File Manager
          # del panel — no bloquea el resto del pipeline.
          exclude: |
            **/.htaccess
