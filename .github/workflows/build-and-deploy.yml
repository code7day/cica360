name: Build y deploy (CICA360 front)

# Ver docs/context/ARCHITECTURE.md §6. El build corre acá (Node disponible
# en el runner) — el shared hosting de destino nunca ejecuta Node, solo
# recibe el `dist/` resultante por FTP/SFTP.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build (astro check + astro build)
        run: npm run build
        env:
          STAMLESS_API_URL: ${{ secrets.STAMLESS_API_URL }}
          STAMLESS_TENANT_SLUG: cica360
          STAMLESS_API_TOKEN: ${{ secrets.STAMLESS_API_TOKEN }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_CONTACT_FORM_ENDPOINT: /contacto.php

      # 2026-09-13 (decisión del Tech Lead, ver PROGRESS.md/ARCHITECTURE.md
      # §6): el deploy queda MANUAL vía cPanel por ahora (no FTP scriptado)
      # — "se debería compilar aquí y con un proceso manual un zip, se suba
      # los archivos a cPanel". Este artifact YA ES ese zip: GitHub Actions
      # empaqueta el contenido de `dist/` (sin la carpeta `dist` en sí, los
      # archivos quedan en la RAÍZ del zip al descargarlo) — se baja desde
      # la página del run ("Artifacts" → `cica360-dist`) y se sube/extrae
      # tal cual en el File Manager de cPanel, en el document root del
      # dominio. `.env` (credenciales reales de `contacto.php`/`ipinfo.php`,
      # ver `public/_env.php`) vive un nivel POR ENCIMA del document root a
      # propósito — la extracción del zip nunca lo toca ni lo pisa, se
      # configura una sola vez en el servidor y sobrevive a cada redeploy.
      - uses: actions/upload-artifact@v4
        with:
          name: cica360-dist
          path: dist/
          retention-days: 7

      # --- Deploy automático (FTP) ---
      # NO en uso — decisión explícita de mantener el paso a producción
      # manual mientras el contenido cambia seguido (pre-lanzamiento). Se
      # deja el snippet acá por si más adelante se quiere automatizar (una
      # vez el equipo esté cómodo con la cadencia de publicación): requeriría
      # configurar los secrets FTP_SERVER/FTP_USERNAME/FTP_PASSWORD en
      # Settings -> Secrets del repo.
      #
      # - name: Deploy a shared hosting (FTP)
      #   uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      #   with:
      #     server: ${{ secrets.FTP_SERVER }}
      #     username: ${{ secrets.FTP_USERNAME }}
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     local-dir: ./dist/
      #     server-dir: ./
